# ==============================================================================
# HARDENED NGINX CONFIGURATION FOR TOR HIDDEN SERVICE & ZERO-IP-LEAK
# ==============================================================================
# IMPORTANT:
# Binding to 127.0.0.1 ensures your server NEVER listens on public IP.
# Port scanners (Shodan, Censys) and direct IP visitors will find all ports CLOSED.
# Only Tor daemon routing traffic locally to 127.0.0.1 can reach the application.
# ==============================================================================

server {
    # Listen ONLY on local loopback interface
    listen 127.0.0.1:80;
    listen [::1]:80;
    
    # Catch-all or your .onion domain
    server_name localhost *.onion;
    
    root /var/www/ccc/public;
    index index.php index.html;

    # Hide Nginx version from response headers
    server_tokens off;

    # Maximum Request & Buffer Restrictions
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Strip identifying headers
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header X-CF-Powered-By;

    # Core Laravel Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to FastCGI server (PHP-FPM)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version if needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Block access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ \.(env|json|lock|sql|sqlite|yml|yaml|blade\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
