# ==============================================================================
# HARDENED APACHE CONFIGURATION FOR TOR HIDDEN SERVICE & ZERO-IP-LEAK
# ==============================================================================
# In httpd.conf or apache2.conf, ensure Apache only listens on 127.0.0.1:
# Listen 127.0.0.1:80
# ==============================================================================

<VirtualHost 127.0.0.1:80>
    ServerName localhost
    ServerAlias *.onion
    DocumentRoot /var/www/ccc/public

    # Hide Apache version and OS info
    ServerSignature Off
    ServerTokens Prod

    <Directory /var/www/ccc/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Disable Header Leaks
    Header always unset "X-Powered-By"
    Header unset "X-Powered-By"

    # Block sensitive files
    <FilesMatch "^\.(env|git|htaccess|lock|json)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/tor_error.log
    CustomLog ${APACHE_LOG_DIR}/tor_access.log combined
</VirtualHost>
